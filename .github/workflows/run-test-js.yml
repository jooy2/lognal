name: run-test-js

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/js/**
      - .github/workflows/run-test-js.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: ./packages/js

jobs:
  check:
    name: Lint, type check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Unit tests on Node.js ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: ['22', '24', '26']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  browser:
    name: Browser tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/js/package-lock.json
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser tests
        run: npm run test:browser
        env:
          LOGNAL_TEST_BROWSERS: ${{ matrix.browser }}
