name: publish-documentation

on:
  push:
    branches: [main]
    paths:
      - docs/**
      # The live demos import each package's source, so a change there is published too.
      - packages/**
      - .github/workflows/publish-documentation.yml
  workflow_dispatch:

jobs:
  publish-documentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs

    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch every commit so VitePress can show when each page was last updated.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The demo page frames the real gallery, so it is built into the site's
      # public folder before VitePress copies that folder into the output.
      - name: Build the Flutter gallery
        run: npm run flutter

      # `prebuild` copies each package's CHANGELOG.md into the site.
      - name: Build VitePress site
        run: npm run build

      # See https://github.com/crazy-max/ghaction-github-pages for the options.
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs/dist
          jekyll: false
          fqdn: 'lognal.cdget.com'
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
